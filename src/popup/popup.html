<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>TST Tree Sorter Settings</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #333333;
      --border-color: #dddddd;
      --button-bg: #f0f0f0;
      --button-text: #333333;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124;
        --text-color: #f1f1f1;
        --border-color: #444444;
        --button-bg: #3c4043;
        --button-text: #f1f1f1;
      }
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      padding: 10px;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .setting {
      margin-bottom: 10px;
    }

    label {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    input[type="number"] {
      width: 60px;
      background-color: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 2px 5px;
    }

    .radio-group {
      margin-top: 10px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    .radio-group-title {
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .radio-option {
      margin-bottom: 8px;
    }

    .radio-option:last-child {
      margin-bottom: 0;
    }

    .radio-option label {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      margin-top: 2px;
      cursor: pointer;
    }

    .radio-option .note {
      font-size: 11px;
      color: #666666;
      margin-left: 20px;
      margin-top: 2px;
    }

    @media (prefers-color-scheme: dark) {
      .radio-option .note {
        color: #9aa0a6;
      }
    }

    button {
      width: 100%;
      padding: 8px;
      margin-top: 10px;
      cursor: pointer;
      background-color: var(--button-bg);
      color: var(--button-text);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="setting">
    <label>
      Disable Sort Confirmation
      <input type="checkbox" id="disableConfirmation">
    </label>
  </div>
  <div class="setting">
    <label>
      Disable Global Sort Confirmation
      <input type="checkbox" id="disableGlobalConfirmation">
    </label>
  </div>
  <div class="setting">
    <label>
      Disable Notifications
      <input type="checkbox" id="disableNotifications">
    </label>
  </div>
  <div class="setting">
    <label>
      Toast Duration (ms)
      <input type="number" id="toastDuration" min="1000" step="500">
    </label>
  </div>

  <div class="radio-group">
    <div class="radio-group-title">Sorting Mode</div>
    <div class="radio-option">
      <label>
        <input type="radio" name="sortMode" id="sortModeNatural" value="natural">
        <span><strong>Natural</strong> (1, 2, 10)</span>
      </label>
      <div class="note">Numerical value (Default)</div>
    </div>
    <div class="radio-option">
      <label>
        <input type="radio" name="sortMode" id="sortModeAlphabetic" value="alphabetic">
        <span><strong>Alphabetic</strong> (1, 10, 2)</span>
      </label>
      <div class="note">Locale-aware text order</div>
    </div>
  </div>

  <button id="openOptions">Advanced Options</button>

  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>

</html>
